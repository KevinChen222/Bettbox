display_name: Bettbox Smart
package_name: bettbox-smart
maintainer:
  name: KevinChen222
  email: KevinChen222@users.noreply.github.com

priority: optional
section: x11
installed_size: 6604
essential: false
icon: ./assets/images/icon.png

dependencies:
  - libc6 (>= 2.39)
  - libstdc++6
  - libgtk-3-0t64
  - libayatana-appindicator3-1
  - libkeybinder-3.0-0
  - libcurl4t64
  - liblzma5
  - libsecret-1-0
  - libx11-6
  - libegl1
  - libgl1
  - openjdk-17-jre-headless
  - libcap2-bin

# The upstream client uses the same executable and installation directory.
conflicts:
  - bettbox

keywords:
  - Bettbox
  - Clash
  - ClashMeta
  - Mihomo
  - Proxy

generic_name: Bettbox Smart

categories:
  - Network

startup_notify: true
startup_wm_class: com.appshub.bettbox

extra_files:
  linux/packaging/polkit/90-bettbox.rules: usr/share/polkit-1/rules.d/90-bettbox.rules

postinstall_scripts:
  - |
    CORE_PATH="/usr/share/Bettbox/BettboxCore"
    if [ -f "$CORE_PATH" ]; then
      setcap 'cap_net_admin,cap_net_bind_service,cap_net_raw=+ep' "$CORE_PATH" && sync
    fi
    rm -f /etc/polkit-1/rules.d/90-bettbox.rules /etc/polkit-1/rules.d/99-bettbox.rules /usr/share/polkit-1/rules.d/99-bettbox.rules
