display_name: Bettbox Smart
package_name: bettbox-smart
maintainer:
  name: KevinChen222
  email: KevinChen222@users.noreply.github.com

priority: optional
section: x11
installed_size: 6604
essential: false
icon: ./assets/images/icon.png

dependencies:
  - libc6 (>= 2.39)
  - libstdc++6
  - libgtk-3-0t64
  - libayatana-appindicator3-1
  - libkeybinder-3.0-0
  - libcurl4t64
  - liblzma5
  - libsecret-1-0
  - libx11-6
  - libegl1
  - libgl1
  - openjdk-17-jre-headless

# The upstream client uses the same executable and installation directory.
conflicts:
  - bettbox

keywords:
  - Bettbox
  - Clash
  - ClashMeta
  - Mihomo
  - Proxy

generic_name: Bettbox Smart

categories:
  - Network

startup_notify: true
startup_wm_class: com.appshub.bettbox

postinstall_scripts:
  - |
    CORE_PATH="/usr/share/Bettbox/BettboxCore"
    if [ -f "$CORE_PATH" ]; then
      chown root:root "$CORE_PATH" 2>/dev/null || true
      chmod +sx "$CORE_PATH" 2>/dev/null || true
    fi
postuninstall_scripts:
  - |
    CORE_PATH="/usr/share/Bettbox/BettboxCore"
    if [ -f "$CORE_PATH" ]; then
      chmod -s "$CORE_PATH" 2>/dev/null || true
    fi
