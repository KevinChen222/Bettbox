name: Build Smart

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SENTRY_BACKEND: none
  GRADLE_OPTS: -Dorg.gradle.vfs.watch=false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2022
          - platform: android
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            core/go.sum
            core/Clash.Meta/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'android' && 'aarch64-linux-android' || 'x86_64-pc-windows-msvc' }}
      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android toolchains
        if: matrix.platform == 'android'
        shell: bash
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ndk="$sdk/ndk/28.2.13676358"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ndk" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
      - name: Flutter dependencies and generated models
        shell: bash
        run: |
          mkdir -p assets/data
          flutter pub get
          dart run build_runner build
      - name: Test Smart client integration
        run: flutter test --no-pub test/smart_group_test.dart test/common/smart_update_test.dart test/clash/interface_test.dart test/views/proxies/smart_delay_test.dart test/views/proxies/delay_test_coordinator_test.dart test/widgets/synced_loading_test.dart
      - name: Prepare Smart kernel
        run: dart tool/prepare_smart_core.dart
      - name: Test Go bridge
        working-directory: core
        env:
          CGO_ENABLED: '0'
        run: go test -tags=with_gvisor ./...
      - name: Test Smart kernel integration
        working-directory: core/.smart-mihomo
        env:
          CGO_ENABLED: '0'
        run: go test -tags=with_gvisor ./common/callback ./adapter/outboundgroup ./component/smart/... ./tunnel/statistic ./listener/sing_tun
      - name: Build Windows core and helper
        if: matrix.platform == 'windows'
        run: dart setup.dart windows --arch amd64 --out core --compatible --standard
      - name: Build Windows client
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $coreHash = (Get-FileHash libclash/windows/BettboxCore.exe -Algorithm SHA256).Hash.ToLower()
          flutter build windows --no-pub --release --dart-define=CORE_SHA256=$coreHash --dart-define=APP_ENV=pre --dart-define=APP_STANDARD=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle = 'build/windows/x64/runner/Release'
          foreach ($file in @('Bettbox.exe', 'BettboxCore.exe', 'BettboxHelperService.exe', 'data/flutter_assets/NOTICE')) {
            if (!(Test-Path -LiteralPath "$bundle/$file" -PathType Leaf)) {
              throw "Missing Windows bundle file $file"
            }
          }
          if ((Get-FileHash "$bundle/BettboxCore.exe").Hash.ToLower() -ne $coreHash) {
            throw 'Packaged Windows core does not match the helper token'
          }
          if ((Get-FileHash "$bundle/data/flutter_assets/NOTICE").Hash -ne (Get-FileHash NOTICE).Hash) {
            throw 'Bundled NOTICE differs from the root NOTICE'
          }
          Compress-Archive -Path "$bundle/*" -DestinationPath Bettbox-smart-windows-x64.zip
      - name: Restore Android release keystore
        if: matrix.platform == 'android'
        shell: bash
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          : "${KEYSTORE:?Missing KEYSTORE}" "${KEY_ALIAS:?Missing KEY_ALIAS}" "${STORE_PASSWORD:?Missing STORE_PASSWORD}" "${KEY_PASSWORD:?Missing KEY_PASSWORD}"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          python3 - <<'PY'
          import os

          with open('android/local.properties', 'a', encoding='ascii') as props:
              props.write('\n')
              for key, var in [('keyAlias', 'KEY_ALIAS'), ('storePassword', 'STORE_PASSWORD'), ('keyPassword', 'KEY_PASSWORD')]:
                  value = os.environ[var].encode('utf-16-be')
                  escaped = ''.join(f'\\u{value[i:i+2].hex()}' for i in range(0, len(value), 2))
                  props.write(f'{key}={escaped}\n')
          PY
      - name: Build and verify Android APK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          dart setup.dart android --arch arm64 --out core --standard
          flutter build apk --no-pub --release --split-per-abi --target-platform android-arm64 --dart-define=APP_ENV=pre --dart-define=APP_STANDARD=true
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          bash tool/build-android-verify.sh "$apk"
          cp "$apk" Bettbox-smart-android-arm64-v8a.apk
      - name: Upload Windows package
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: Bettbox-smart-windows-x64
          path: Bettbox-smart-windows-x64.zip
          if-no-files-found: error
      - name: Upload Android arm64 package
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v7
        with:
          name: Bettbox-smart-android-arm64-v8a
          path: Bettbox-smart-android-arm64-v8a.apk
          if-no-files-found: error
