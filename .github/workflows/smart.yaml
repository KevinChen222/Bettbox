name: Build Smart

on:
  push:
    branches: [feat/smart-core]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SENTRY_BACKEND: none
  GRADLE_OPTS: -Dorg.gradle.vfs.watch=false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2022
          - platform: android
            os: ubuntu-24.04
          - platform: linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            core/go.sum
            core/Clash.Meta/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'android' && 'aarch64-linux-android' || matrix.platform == 'linux' && 'x86_64-unknown-linux-gnu' || 'x86_64-pc-windows-msvc' }}
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config desktop-file-utils libgtk-3-dev libayatana-appindicator3-dev libkeybinder-3.0-dev libcurl4-openssl-dev liblzma-dev libsecret-1-dev libx11-dev libgl1-mesa-dev
      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android toolchains
        if: matrix.platform == 'android'
        shell: bash
        run: |
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/28.2.13676358" >> "$GITHUB_ENV"
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "${ANDROID_SDK_ROOT}/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          EOF
      - name: Flutter dependencies and generated models
        run: |
          flutter pub get
          dart run build_runner build -d
      - name: Bundle proxy-chain license and attribution
        run: |
          cp lib/features/chains/LICENSE assets/data/avalon-chain-LICENSE.txt
          cp NOTICE assets/data/avalon-chain-NOTICE.txt
      - name: Test Smart client models and proxy chains
        run: flutter test test/features/chains test/smart_group_test.dart test/views/proxies/smart_delay_test.dart test/views/proxies/delay_test_coordinator_test.dart test/controller_loading_test.dart test/main_page_titles_test.dart
      - name: Prepare Smart kernel
        run: dart tool/prepare_smart_core.dart
      - name: Test Go bridge
        working-directory: core
        env:
          CGO_ENABLED: '0'
        run: go test -tags=with_gvisor ./...
      - name: Test Smart kernel integration
        working-directory: core/.smart-mihomo
        env:
          CGO_ENABLED: '0'
        run: go test -tags=with_gvisor ./common/callback ./adapter/outboundgroup ./component/smart/... ./tunnel/statistic ./listener/sing_tun
      - name: Build Windows core and helper
        if: matrix.platform == 'windows'
        run: dart setup.dart windows --arch amd64 --out core --compatible
      - name: Build Windows client
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $coreHash = (Get-FileHash libclash/windows/BettboxCore.exe -Algorithm SHA256).Hash.ToLower()
          flutter build windows --release --dart-define=CORE_SHA256=$coreHash --dart-define=APP_ENV=pre
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Bettbox-smart-windows-x64.zip
      - name: Build Linux x64 core and DEB
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          dart setup.dart linux --arch amd64 --out core
          dart pub global activate --source path plugins/flutter_distributor/packages/flutter_distributor
          dart pub global run flutter_distributor:main package --skip-clean --platform linux --targets deb --description x64 --build-target-platform linux-x64 --build-dart-define=APP_ENV=pre
          packages=(dist/*.deb)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          cp "${packages[0]}" Bettbox-smart-linux-x64.deb
          test "$(dpkg-deb -f Bettbox-smart-linux-x64.deb Package)" = bettbox-smart
          test "$(dpkg-deb -f Bettbox-smart-linux-x64.deb Architecture)" = amd64
          test "$(dpkg-deb -f Bettbox-smart-linux-x64.deb Version)" = "$(awk '/^version:/ {print $2}' pubspec.yaml)"
          mkdir -p .test/linux-deb
          dpkg-deb -x Bettbox-smart-linux-x64.deb .test/linux-deb
          test -x .test/linux-deb/usr/share/Bettbox/Bettbox
          test -x .test/linux-deb/usr/share/Bettbox/BettboxCore
          test -u .test/linux-deb/usr/share/Bettbox/BettboxCore
          test -f .test/linux-deb/usr/share/Bettbox/data/flutter_assets/assets/data/avalon-chain-LICENSE.txt
          test -f .test/linux-deb/usr/share/Bettbox/data/flutter_assets/assets/data/avalon-chain-NOTICE.txt
          desktop-file-validate .test/linux-deb/usr/share/applications/Bettbox.desktop
      - name: Build Android core and APK
        if: matrix.platform == 'android'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > android/app/keystore.jks
            printf '\nkeyAlias=%s\nstorePassword=%s\nkeyPassword=%s\n' "$KEY_ALIAS" "$STORE_PASSWORD" "$KEY_PASSWORD" >> android/local.properties
          fi
          dart setup.dart android --arch arm64 --out core
          flutter build apk --release --split-per-abi --target-platform android-arm64 --dart-define=APP_ENV=pre
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Bettbox-smart-android-arm64-v8a.apk
      - name: Upload Windows package
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: Bettbox-smart-windows-x64
          path: Bettbox-smart-windows-x64.zip
          if-no-files-found: error
      - name: Upload Android arm64 package
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v7
        with:
          name: Bettbox-smart-android-arm64-v8a
          path: Bettbox-smart-android-arm64-v8a.apk
          if-no-files-found: error
      - name: Upload Linux x64 DEB
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: Bettbox-smart-linux-x64
          path: Bettbox-smart-linux-x64.deb
          if-no-files-found: error
